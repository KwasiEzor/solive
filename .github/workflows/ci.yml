name: CI

on:
  push:
    branches: [main]
  pull_request:

# Later phases append: test:integration, lighthouse, test:e2e (SLV-150).
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SITE_URL: https://solive.be
      # E2E boots a real `next start` (via Playwright's webServer) that hits
      # the actual Supabase project used locally — same one, not a separate
      # CI-only project (decision: simplicity over isolation for now). Set
      # these as repo secrets (Settings → Secrets and variables → Actions,
      # or `gh secret set <NAME>`); values match .env.local.
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      IP_HASH_SALT: ${{ secrets.IP_HASH_SALT }}
    steps:
      - uses: actions/checkout@v4

      # Version read from package.json's "packageManager" field — an explicit
      # `with: version:` here conflicts with it (ERR_PNPM_BAD_PM_VERSION).
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests + coverage
        run: pnpm test:coverage

      - name: Build
        run: pnpm build

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E security tests (SLV-146)
        run: pnpm test:e2e

      - name: Audit (high/critical block deploy — SLV-058)
        run: pnpm audit --audit-level=high
