name: CI

on:
  push:
    branches: [main]
  pull_request:

# Later phases append: test:integration, lighthouse, test:e2e (SLV-150).
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SITE_URL: https://solive.be
    steps:
      - uses: actions/checkout@v4

      # Version read from package.json's "packageManager" field — an explicit
      # `with: version:` here conflicts with it (ERR_PNPM_BAD_PM_VERSION).
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests + coverage
        run: pnpm test:coverage

      - name: Build
        run: pnpm build

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E security tests (SLV-146)
        run: pnpm test:e2e

      - name: Audit (high/critical block deploy — SLV-058)
        run: pnpm audit --audit-level=high
